name: Build APK Find New Error

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/

    - name: Install NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    # SỬA LỖI CŨ
    - name: "🔧 Fix duplicate import"
      run: |
        FILE="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt"
        sed -i '29d' "$FILE"
        echo "✅ Fixed import"

    # BUILD VÀ LƯU LOG CHI TIẾT
    - name: "🚀 Build with Full Log"
      run: |
        cd duix-android/dh_aigc_android
        
        # Build và lưu toàn bộ output
        ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build_output.log || true
        
        echo ""
        echo "========================================="
        echo "🔴 TÌM LỖI MỚI:"
        echo "========================================="
        
        # Tìm task failed
        echo "📌 TASK FAILED:"
        grep "> Task.*FAILED" build_output.log | head -10 || echo "Không tìm thấy"
        
        echo ""
        echo "📌 ERROR LINES:"
        grep -i "error:" build_output.log | grep -v "BuildExceptionReporter" | head -20 || echo "Không tìm thấy"
        
        echo ""
        echo "📌 KOTLIN ERRORS:"
        grep "e: " build_output.log | head -30 || echo "Không tìm thấy"
        
        echo ""
        echo "📌 CANNOT FIND/RESOLVE:"
        grep -i "cannot find\|cannot resolve\|unresolved" build_output.log | head -20 || echo "Không tìm thấy"

    # UPLOAD LOG ĐẦY ĐỦ
    - name: Upload Full Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output-log
        path: duix-android/dh_aigc_android/build_output.log
        if-no-files-found: ignore

    # THỬ BUILD TỪNG MODULE
    - name: "🧪 Test Build Each Module"
      if: failure()
      run: |
        cd duix-android/dh_aigc_android
        
        echo "========================================="
        echo "🧪 TEST BUILD TỪNG MODULE:"
        echo "========================================="
        
        echo "1️⃣ Build :app"
        ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -50 || true
        
        echo ""
        echo "2️⃣ Build :duix-sdk"  
        ./gradlew :duix-sdk:assembleDebug --stacktrace 2>&1 | tail -50 || true
        
        echo ""
        echo "3️⃣ Build :test (module có lỗi)"
        ./gradlew :test:assembleDebug --stacktrace 2>&1 | tail -50 || true

    # KIỂM TRA CÁC FILE KHÁC CÓ LỖI
    - name: "🔍 Check Other Files"
      if: always()
      run: |
        cd duix-android/dh_aigc_android
        
        echo "========================================="
        echo "🔍 KIỂM TRA FILE KOTLIN KHÁC:"
        echo "========================================="
        
        # Tìm tất cả file .kt trong module test
        find test -name "*.kt" -type f | while read file; do
          # Kiểm tra import trùng
          if grep -c "^import.*CompoundButton" "$file" 2>/dev/null | grep -q "2"; then
            echo "❌ $file - Có import CompoundButton trùng"
          fi
          
          # Kiểm tra các import có vấn đề khác
          if grep -E "^import.*\s+import\s+" "$file" 2>/dev/null; then
            echo "❌ $file - Có vấn đề với import"
          fi
        done
