name: Dual Java Setup (Fix SDKManager & Kotlin)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # GIAI ĐOẠN 1: Dùng JAVA 17 để chạy tool SDKMANAGER
      # ---------------------------------------------------------
      - name: Set up JDK 17 (For SDK Tools)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install CMake 3.18.1 (Using Java 17)
        run: |
          echo "Installing CMake 3.18.1..."
          echo "yes" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.18.1"
          
          echo "✅ CMake installed versions:"
          ls -l ${ANDROID_HOME}/cmake

      # ---------------------------------------------------------
      # GIAI ĐOẠN 2: Chuyển sang JAVA 11 để Build Code cũ
      # ---------------------------------------------------------
      - name: Set up JDK 11 (For Build)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Cài đặt Gradle 8.5
      - name: Setup Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # GIAI ĐOẠN 3: BUILD VÀ DEBUG
      # ---------------------------------------------------------
      - name: Build Debug APK (With JDK 11)
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building..."
          echo "Using Java version:"
          java -version
          
          # Build với Java 11 và cấp 3GB RAM
          gradle assembleDebug --no-daemon --stacktrace --info -Dorg.gradle.jvmargs=-Xmx3072m > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # HIỂN THỊ LỖI (Vẫn giữ 200 dòng cuối)
      - name: 🔴 SHOW REAL ERROR (Last 200 lines)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "👇 ĐÂY MỚI LÀ LỖI (LAST 200 LINES) - COPY ĐOẠN NÀY 👇"
          echo "========================================================="
          tail -n 200 build_log.txt
          echo "========================================================="
          exit 1

      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
