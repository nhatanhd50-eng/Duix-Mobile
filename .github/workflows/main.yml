name: Build APK Update Gradle

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Force cập nhật Gradle Wrapper lên 8.3
    - name: Force Update to Gradle 8.3
      run: |
        echo "Đang di chuyển vào thư mục dự án..."
        cd duix-android/dh_aigc_android
        
        # 1. Tải đúng bản Gradle 8.3 (Bản này chạy ổn định với project cũ)
        echo "Đang tải Gradle bản 8.3..."
        wget https://services.gradle.org/distributions/gradle-8.3-bin.zip
        
        # 2. Giải nén
        echo "Đang giải nén..."
        unzip -q gradle-8.3-bin.zip
        
        # 3. Dùng bản này để tạo lại gradlew (ghi đè bản cũ)
        echo "Đang tạo lại gradlew với bản 8.3..."
        ./gradle-8.3/bin/gradle wrapper --gradle-version 8.3
        
        # 4. Dọn dẹp
        rm gradle-8.3-bin.zip
        rm -rf gradle-8.3/
        
        # 5. Cấp quyền
        chmod +x gradlew
        echo "Đã cập nhật xong gradlew lên bản 8.3!"

    # Bước 5: Build (Lần này sẽ dùng Gradle 8.3)
    - name: Build with Gradle
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew assembleDebug --stacktrace

    # Bước 6: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-Updated-APK
        path: '**/*.apk'
