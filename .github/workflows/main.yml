name: Build APK Clean Gradle

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Setup Gradle chính thức và Tạo lại Gradlew
    - name: Setup Gradle and Wrapper
      run: |
        cd duix-android/dh_aigc_android
        
        # Xóa sạch file gradlew cũ (để tránh xung đột)
        rm -f gradlew gradlew.bat
        
        # Dùng Action chính thức của Gradle để cài đặt công cụ
        # Lệnh này sẽ tự động tải bản Gradle cần thiết và tạo ra file gradlew chuẩn
        gradle wrapper --gradle-version 8.3
        
        # Cấp quyền
        chmod +x gradlew
