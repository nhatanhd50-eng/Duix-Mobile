name: Build & Show Last 200 Lines (Fixed Debug)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. CÀI ĐẶT GRADLE 8.5
      - name: Setup Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      # 2. CHẠY BUILD & GHI LOG
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building... (Please wait)"
          
          # Lưu log vào file build_log.txt
          gradle assembleDebug --no-daemon --stacktrace --info > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 3. HIỂN THỊ 200 DÒNG CUỐI (Nơi chứa lỗi thực sự)
      - name: 🔴 SHOW REAL ERROR (Last 200 lines)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "👇 ĐÂY MỚI LÀ LỖI (LAST 200 LINES) - COPY ĐOẠN NÀY 👇"
          echo "========================================================="
          
          # In 200 dòng cuối cùng của file log, nơi Gradle báo lỗi tổng hợp
          tail -n 200 build_log.txt
          
          echo "========================================================="
          exit 1

      # 4. UPLOAD APK (Nếu thành công)
      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
