name: Build APK with Gradle 9.0 & Logs (Step-by-step Debug)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List root directory
        run: ls -la

      - name: Change to Android project dir
        run: |
          cd duix-android/dh_aigc_android
          pwd
          ls -la

      - name: Check if gradlew exists
        run: |
          cd duix-android/dh_aigc_android
          if [ -f gradlew ]; then
            echo "gradlew exists."
          else
            echo "gradlew NOT FOUND!"
          fi

      - name: Check gradle wrapper structure
        run: |
          cd duix-android/dh_aigc_android
          if [ -d gradle ]; then
            echo "gradle directory exists:"
            find gradle -type f
          else
            echo "gradle directory NOT FOUND!"
          fi

      - name: Create gradlew if missing
        run: |
          cd duix-android/dh_aigc_android
          if [ ! -f gradlew ]; then
            echo "Creating gradlew..."
            # Dùng echo thay cho cat EOF để tránh lỗi thụt dòng YAML
            echo '#!/bin/sh' > gradlew
            echo 'exec java -jar "gradle/wrapper/gradle-wrapper.jar" "$@"' >> gradlew
            chmod +x gradlew
          else
            echo "gradlew already exists."
          fi

      - name: Check gradle wrapper JAR
        run: |
          cd duix-android/dh_aigc_android
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar exists."
            jar -tf gradle/wrapper/gradle-wrapper.jar | head -10
          else
            echo "gradle-wrapper.jar NOT FOUND!"
          fi

      - name: Update Gradle Wrapper to 9.0
        run: |
          cd duix-android/dh_aigc_android
          ./gradlew wrapper --gradle-version 9.0 --distribution-type bin

      - name: Check gradlew version
        run: |
          cd duix-android/dh_aigc_android
          ./gradlew --version

      - name: Build Debug APK
        id: build_debug
        run: |
          cd duix-android/dh_aigc_android
          ./gradlew assembleDebug --no-daemon --stacktrace --info > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Print Full Build Log (if failed)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "📋 FULL BUILD LOG (COPY ALL BELOW):"
          echo "====================================="
          cat build_log.txt
          echo "====================================="

      - name: Upload Build Log (on failure)
        if: env.BUILD_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: duix-android/dh_aigc_android/build_log.txt

      - name: Upload Debug APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: duix-android/dh_aigc_android/app/build/outputs/apk/debug/app-debug.apk
