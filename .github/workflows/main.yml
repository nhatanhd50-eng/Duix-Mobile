name: Build APK Auto Fix Gradlew

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code (Chắc chắn có gradle/wrapper)
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: duixcom/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Tự sinh lại file gradlew bị thiếu
    - name: Restore Missing Gradlew
      run: |
        echo "Đang tìm file cấu hình wrapper..."
        # Tìm file gradle-wrapper.properties
        WRAPPER_PROPS=$(find . -name "gradle-wrapper.properties" | head -n 1)
        
        if [ -z "$WRAPPER_PROPS" ]; then
          echo "Không tìm thấy file gradle-wrapper.properties!"
          exit 1
        fi

        # Lấy đường dẫn thư mục dự án (nhảy lên 2 cấp từ gradle/wrapper)
        # VD: ./duix-android/dh_aigc_android/gradle/wrapper/gradle-wrapper.properties
        # -> Cần ra đến: ./duix-android/dh_aigc_android
        PROJECT_DIR=$(dirname $(dirname "$WRAPPER_PROPS"))
        
        echo "Đang di chuyển đến dự án tại: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        echo "Đang sinh file gradlew bằng lệnh gradle wrapper..."
        # Câu lệnh này sẽ tự tạo ra file gradlew dựa trên file .jar và .properties bạn thấy
        gradle wrapper --gradle-version 7.5
        
        # Kiểm tra lại
        if [ ! -f "gradlew" ]; then
          echo "Thất bại: Vẫn không thể tạo gradlew!"
          exit 1
        fi
        
        chmod +x gradlew
        echo "Đã tạo xong file gradlew!"

    # Bước 5: Build
    - name: Build with Gradle
      run: |
        # Tìm lại gradlew vừa tạo để chạy
        GRADLEW=$(find . -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW")
        ./gradlew assembleDebug --stacktrace

    # Bước 6: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-Fixed-APK
        path: '**/*.apk'
