name: Build APK - Find and Upload

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake and NDK
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
        sdkmanager "ndk;25.2.9519653"

    # FIX CODE
    - name: "🔧 Fix Kotlin Files"
      run: |
        # 1. Fix CallActivity.kt
        CALL_ACTIVITY="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt"
        sed -i '29d' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/\.backgroundColor = /.setBackgroundColor(/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/etChat!!\.backgroundColor/etChat!!.setBackgroundColor/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun setupChatUI/protected override fun setupChatUI/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun addChatMessage/protected override fun addChatMessage/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/var length = 0/var length: Int/g' "$CALL_ACTIVITY" 2>/dev/null || true

        # 2. Fix MainActivity.kt
        MAIN_ACTIVITY="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt"
        sed -i 's/\.backgroundColor = /.setBackgroundColor(/g' "$MAIN_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun setupChatUI/protected override fun setupChatUI/g' "$MAIN_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun addChatMessage/protected override fun addChatMessage/g' "$MAIN_ACTIVITY" 2>/dev/null || true

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    # ===== CHECK PROJECT STRUCTURE =====
    - name: "📋 Kiểm Tra Cấu Trúc Project"
      run: |
        cd duix-android/dh_aigc_android
        echo "========================================="
        echo "📋 MODULE NÀO TẠO APK?"
        echo "========================================="
        
        echo "📝 settings.gradle:"
        cat settings.gradle || cat settings.gradle.kts || echo "Không tìm thấy"
        
        echo ""
        echo "📝 Xem module app có tạo application không:"
        grep -E "apply plugin: 'com.android.application'|plugins \{.*application.*\}" app/build.gradle || echo "Không phải application"
        
        echo ""
        echo "📝 Xem module test có tạo application không:"
        grep -E "apply plugin: 'com.android.application'|plugins \{.*application.*\}" test/build.gradle || echo "Không phải application"

    # ===== BUILD ALL MODULES =====
    - name: "🚀 Build Tất Cả Modules"
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew build --stacktrace

    # ===== TÌM KIẾM APK Ở NHIỀU NƠI =====
    - name: "🔍 Tìm APK Ở MỌI NƠI"
      if: always()
      run: |
        echo "========================================="
        echo "🔍 TÌM TẤT CẢ FILE APK TRONG WORKSPACE:"
        echo "========================================="
        find . -name "*.apk" -type f -exec ls -lh {} \; || echo "❌ Không tìm thấy file APK nào"
        
        echo ""
        echo "========================================="
        echo "📁 Xem outputs Của Module app:"
        echo "========================================="
        ls -la duix-android/dh_aigc_android/app/build/outputs/ 2>/dev/null || echo "Không có thư mục outputs"
        
        echo ""
        echo "========================================="
        echo "📁 Xem outputs Của Module test:"
        echo "========================================="
        ls -la duix-android/dh_aigc_android/test/build/outputs/ 2>/dev/null || echo "Không có thư mục outputs"
        
        echo ""
        echo "========================================="
        echo "📁 Tìm Tất Cả Thư Mục outputs:"
        echo "========================================="
        find . -name "outputs" -type d -exec ls -la {} \; 2>/dev/null || echo "Không có thư mục outputs"
        
        echo ""
        echo "========================================="
        echo "📁 Xem intermediate Của Module app:"
        echo "========================================="
        find duix-android/dh_aigc_android/app/build -name "intermediate" -type d -exec ls -la {} \; 2>/dev/null || echo "Không có thư mục intermediate"

    # ===== THỬ BUILD RIÊNG APP MODULE =====
    - name: "🚀 Build Riêng Module app"
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew :app:assembleDebug --stacktrace

    # ===== THỬ BUILD RIÊNG TEST MODULE =====
    - name: "🚀 Build Riêng Module test"
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew :test:assembleDebug --stacktrace

    # ===== TÌM LẠI APK SAU BUILD RIÊNG =====
    - name: "🔍 Tìm Lại APK Sau Build Riêng"
      if: always()
      run: |
        echo "========================================="
        echo "🔍 TÌM LẠI TẤT CẢ FILE APK:"
        echo "========================================="
        find . -name "*.apk" -type f -exec ls -lh {} \;
        
        # Lưu danh sách APK vào file
        find . -name "*.apk" -type f > apk_list.txt

    # ===== UPLOAD APK =====
    - name: "📤 Upload Tất Cả APK"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-apk-files
        path: |
          **/*.apk
        if-no-files-found: warn
        
    # ===== UPLOAD APK LIST =====
    - name: "📤 Upload Danh Sách APK"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk-list
        path: apk_list.txt
        if-no-files-found: warn

    # ===== UPLOAD MODIFIED FILES =====
    - name: "📤 Upload Modified Kotlin Files"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: modified-kotlin-files
        path: |
          duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt
          duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt
        if-no-files-found: warn
