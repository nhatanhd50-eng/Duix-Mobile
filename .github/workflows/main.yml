name: Build APK Upload Everything

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Licenses
      run: yes | sdkmanager --licenses || true

    - name: Install CMake 3.18.1
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/

    - name: Install NDK
      run: |
        sdkmanager "ndk;25.2.9519653"

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        chmod +x gradlew

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    - name: Build APK
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew assembleDebug --stacktrace --no-daemon
      continue-on-error: true

    # TÌM MỌI FILE (QUAN TRỌNG!)
    - name: Find Everything Built
      if: always()
      run: |
        cd duix-android/dh_aigc_android
        
        echo "========================================="
        echo "🔍 TÌM TẤT CẢ FILE .APK:"
        echo "========================================="
        find . -name "*.apk" -type f -exec ls -lh {} \; || echo "❌ KHÔNG CÓ APK"
        
        echo ""
        echo "========================================="
        echo "🔍 TÌM TẤT CẢ FILE .AAB:"
        echo "========================================="
        find . -name "*.aab" -type f -exec ls -lh {} \; || echo "❌ KHÔNG CÓ AAB"
        
        echo ""
        echo "========================================="
        echo "📁 KIỂM TRA THU MỤC app/build:"
        echo "========================================="
        ls -laR app/build/ 2>/dev/null || echo "❌ KHÔNG CÓ THƯ MỤC app/build"
        
        echo ""
        echo "========================================="
        echo "📁 TÌM MỌI THƯ MỤC 'outputs':"
        echo "========================================="
        find . -type d -name "outputs" 2>/dev/null || echo "❌ KHÔNG CÓ THƯ MỤC outputs"

    # UPLOAD TOÀN BỘ THƯ MỤC BUILD
    - name: Upload Entire Build Directory
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: complete-build-folder
        path: duix-android/dh_aigc_android/app/build/
        if-no-files-found: warn

    # UPLOAD MỌI FILE APK/AAB TÌM ĐƯỢC
    - name: Upload APK/AAB
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk-aab-files
        path: |
          duix-android/**/*.apk
          duix-android/**/*.aab
        if-no-files-found: warn
