name: Build APK with Gradle 9.0 & Debug Logs (Fixed)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Change to Android project dir
        run: |
          cd duix-android/dh_aigc_android
          echo "Current directory:"
          pwd

      # 1. TẠO FILE GRADLEW (Sử dụng echo để tránh lỗi thụt dòng YAML)
      - name: Create gradlew if missing
        run: |
          cd duix-android/dh_aigc_android
          if [ ! -f gradlew ]; then
            echo "Creating gradlew..."
            echo '#!/bin/sh' > gradlew
            echo 'exec java -jar "gradle/wrapper/gradle-wrapper.jar" "$@"' >> gradlew
            chmod +x gradlew
          fi

      # 2. CÀI ĐẶT/UPDATE GRADLE (Có ghi log lỗi)
      - name: Update Gradle Wrapper to 9.0
        id: install_gradle
        run: |
          cd duix-android/dh_aigc_android
          echo "Starting Gradle update..."
          # Chạy lệnh update và lưu log vào file gradle_install_log.txt
          # Nếu lỗi, gán biến INSTALL_FAILED=true
          ./gradlew wrapper --gradle-version 9.0 --distribution-type bin > gradle_install_log.txt 2>&1 || echo "INSTALL_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      # 3. HIỂN THỊ LỖI CÀI ĐẶT (Nếu bước trên thất bại)
      - name: Print Gradle Install Error (if failed)
        if: env.INSTALL_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "❌ GRADLE INSTALLATION FAILED!"
          echo "👇 BELOW IS THE INSTALLATION LOG 👇"
          echo "====================================="
          cat gradle_install_log.txt
          echo "====================================="
          exit 1 # Bắt buộc dừng quy trình tại đây nếu cài đặt lỗi

      - name: Check gradlew version (Verify)
        if: env.INSTALL_FAILED != 'true'
        run: |
          cd duix-android/dh_aigc_android
          ./gradlew --version

      # 4. BUILD APK (Có ghi log lỗi build riêng)
      - name: Build Debug APK
        id: build_debug
        if: env.INSTALL_FAILED != 'true'
        run: |
          cd duix-android/dh_aigc_android
          # Lưu log build vào file build_log.txt
          ./gradlew assembleDebug --no-daemon --stacktrace --info > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      # 5. HIỂN THỊ LỖI BUILD (Nếu bước build thất bại)
      - name: Print Full Build Log (if failed)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "📋 FULL BUILD LOG (COPY ALL BELOW):"
          echo "====================================="
          cat build_log.txt
          echo "====================================="

      - name: Upload Build Log (on failure)
        if: env.BUILD_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: duix-android/dh_aigc_android/build_log.txt

      - name: Upload Debug APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: duix-android/dh_aigc_android/app/build/outputs/apk/debug/app-debug.apk
