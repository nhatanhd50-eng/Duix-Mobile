name: Build APK Final

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile # Dùng repo của bạn cho đúng với link
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Cài đặt công cụ Gradle để tạo gradlew (Cái này quan trọng)
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    # Bước 5: Vào đúng thư mục, Tạo gradlew và Build
    - name: Restore Gradlew and Build
      run: |
        echo "Đang di chuyển vào thư mục dự án..."
        # Vào đúng thư mục bạn đang thấy gradle/wrapper
        cd duix-android/dh_aigc_android
        
        echo "Nội dung thư mục hiện tại:"
        ls -la
        
        # Kiểm tra xem có file gradlew chưa
        if [ ! -f "gradlew" ]; then
          echo "Chưa có gradlew. Đang dùng lệnh gradle để tạo lại từ file .jar và .properties..."
          # Lệnh này sẽ đọc file cấu hình trong gradle/wrapper để sinh ra gradlew
          gradle wrapper
          
          echo "Đã tạo xong gradlew, đang cấp quyền..."
          chmod +x gradlew
        else
          echo "Đã có file gradlew."
          chmod +x gradlew
        fi

        # Bắt đầu Build
        echo "Bắt đầu build APK..."
        ./gradlew assembleDebug --stacktrace

    # Bước 6: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-My-Fork-APK
        path: '**/*.apk'
