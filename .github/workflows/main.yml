name: Build APK (Old Logic + LLM Memory Fix)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Clone code của bạn (Code hiện tại chứa LLM/TTS)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cài Java 17 (Chuẩn theo YAML cũ)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cài CMake 3.18.1 THỦ CÔNG (Lấy từ YAML cũ - Đã chứng minh hoạt động tốt)
      - name: Install CMake 3.18.1 (Manual)
        run: |
          echo "Downloading CMake 3.18.1..."
          wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
          
          mkdir -p $ANDROID_HOME/cmake/3.18.1
          cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
          
          echo "✅ CMake 3.18.1 installed at $ANDROID_HOME/cmake/3.18.1"

      # 5. Khôi phục Gradle 8.3 (Lấy từ YAML cũ - Để tương thích code cũ)
      - name: Restore Gradlew (Gradle 8.3)
        run: |
          cd duix-android/dh_aigc_android
          
          echo "Resetting Gradle Wrapper to 8.3..."
          rm -rf gradlew gradlew.bat gradle/
          mkdir -p gradle/wrapper
          
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          chmod +x gradlew

      # 6. BUILD (CÓ FIX RAM CHO LLM/TTS)
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building with Gradle 8.3 & High Memory..."
          
          # QUAN TRỌNG: Thêm tham số cấp 6GB RAM và in-process
          # Nếu không có dòng này, code LLM nặng sẽ làm sập build
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process \
            > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 7. HIỂN THỊ LỖI (200 dòng cuối như bạn yêu cầu)
      - name: 🔴 SHOW ERROR LOG (Last 200 lines)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "👇 ĐÂY MỚI LÀ LỖI (LAST 200 LINES) - COPY ĐOẠN NÀY 👇"
          echo "========================================================="
          tail -n 200 build_log.txt
          echo "========================================================="
          exit 1

      # 8. Upload APK (Tự động tìm file)
      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Duix-Mobile-Debug-APK
          path: '**/*.apk'
