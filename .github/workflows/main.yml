name: Build APK (Auto-Fix Namespace)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake 3.18.1 (Manual)
        run: |
          echo "Downloading CMake 3.18.1..."
          wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
          mkdir -p $ANDROID_HOME/cmake/3.18.1
          cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
          echo "✅ CMake 3.18.1 installed."

      - name: Restore Gradlew (Force Gradle 8.3)
        run: |
          cd duix-android/dh_aigc_android
          rm -rf gradlew gradlew.bat gradle/
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew

      # --- BƯỚC MỚI: TỰ ĐỘNG SỬA FILE ĐỂ KHỚP VỚI GRADLE MỚI ---
      - name: Auto-Fix Namespace (AGP 8.0 Compatibility)
        run: |
          cd duix-android/dh_aigc_android
          
          echo "🔧 Fixing SDK Module..."
          # 1. Xóa package="..." trong Manifest của SDK
          sed -i 's/package="ai.guiji.duix.sdk"//g' duix-sdk/src/main/AndroidManifest.xml
          
          # 2. Chèn namespace vào build.gradle của SDK (Ngay sau dòng 'android {')
          sed -i '/android {/a \    namespace "ai.guiji.duix.sdk"' duix-sdk/build.gradle
          
          echo "🔧 Fixing Test/App Module..."
          # 3. Xóa package="..." trong Manifest của App (Dựa vào log lỗi trước có thể là thư mục test hoặc app)
          if [ -f "test/src/main/AndroidManifest.xml" ]; then
             sed -i 's/package="ai.guiji.duix.test"//g' test/src/main/AndroidManifest.xml
          fi
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
             sed -i 's/package="ai.guiji.duix.test"//g' app/src/main/AndroidManifest.xml
          fi

          # 4. Chèn namespace vào build.gradle của App
          if [ -f "test/build.gradle" ]; then
             sed -i '/android {/a \    namespace "ai.guiji.duix.test"' test/build.gradle
          fi
          if [ -f "app/build.gradle" ]; then
             sed -i '/android {/a \    namespace "ai.guiji.duix.test"' app/build.gradle
          fi
          
          echo "✅ Auto-fix complete!"

      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building..."
          ./gradlew assembleDebug \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process \
            > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: 🔴 SHOW ACTUAL ERRORS
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "🔥 LOG LỖI (ERRORS) 🔥"
          echo "========================================================="
          if grep -q "e: " build_log.txt; then
            grep -C 3 "e: " build_log.txt
          else
             grep -C 10 -E "(FAILURE:|FAILED|What went wrong:|Exception)" build_log.txt
          fi
          echo "========================================================="
          exit 1

      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Duix-Mobile-APK
          path: '**/*.apk'
