name: Fix Kotlin Crash (JDK 11) & Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. DÙNG JDK 11 THAY VÌ 17 (Để tương thích với Kotlin cũ)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. CÀI ĐẶT CMAKE 3.18.1 (Vẫn giữ bước này vì dự án cần)
      - name: Install CMake 3.18.1
        run: |
          echo "Installing CMake 3.18.1..."
          echo "yes" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.18.1"

      # 3. CÀI ĐẶT GRADLE 8.5
      - name: Setup Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      # 4. CHẠY BUILD (Thêm tham số cấp thêm RAM -Xmx3072m)
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building with JDK 11 & More RAM..."
          
          # Thêm -Dorg.gradle.jvmargs=-Xmx3072m để cấp 3GB RAM cho Gradle Daemon
          gradle assembleDebug --no-daemon --stacktrace --info -Dorg.gradle.jvmargs=-Xmx3072m > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 5. HIỂN THỊ LỖI (Vẫn giữ in 200 dòng cuối để debug)
      - name: 🔴 SHOW REAL ERROR (Last 200 lines)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "👇 ĐÂY MỚI LÀ LỖI (LAST 200 LINES) - COPY ĐOẠN NÀY 👇"
          echo "========================================================="
          tail -n 200 build_log.txt
          echo "========================================================="
          exit 1

      # 6. UPLOAD APK
      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
