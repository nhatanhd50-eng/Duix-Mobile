name: Fix Kotlin Files & Build APK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake and NDK
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
        sdkmanager "ndk;25.2.9519653"

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    # ===== BƯỚC SỬA TỰ ĐỘNG CÁC FILE =====
    - name: "🔧 Fix CallActivity.kt"
      run: |
        CALL_ACTIVITY="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt"
        
        echo "🔍 Đang sửa CallActivity.kt..."
        
        # 1. Xóa dòng import trùng lặp
        sed -i '29d' "$CALL_ACTIVITY" || echo "Không xóa được import trùng"
        
        # 2. Tạo file tạm để dễ sửa bằng awk
        awk '{
          # Sửa lỗi backgroundColor -> setBackgroundColor
          gsub(/\.backgroundColor = /, ".setBackgroundColor(")
          gsub(/etChat!!\.backgroundColor/, "etChat!!.setBackgroundColor")
          
          # Sửa định nghĩa setupChatUI
          gsub(/private fun setupChatUI/, "protected override fun setupChatUI")
          
          # Sửa định nghĩa addChatMessage
          gsub(/private fun addChatMessage/, "protected override fun addChatMessage")
          
          # Sửa lambda cho switchMute
          if ($0 ~ /binding.switchMute.setOnCheckedChangeListener/) {
            print "        binding.switchMute.setOnCheckedChangeListener { _, isChecked ->\n"
            getline; getline; getline; getline
            print "            if (isChecked) {\n                duix?.setVolume(0.0F)\n            } else {\n                duix?.setVolume(1.0F)\n            }\n        }"
            next
          }
          
          # Fix var length = 0
          gsub(/var length = 0/, "var length: Int")
          
          print
        }' "$CALL_ACTIVITY" > temp_file && mv temp_file "$CALL_ACTIVITY"
        
        # 3. Thêm callback cho duix.setResponseCallback
        sed -i '/duix = DUIX/,/duix?.init()/ s/applyMessage("start init")/applyMessage("start init")\n\n        \/\/ Đăng ký callback nhận response\n        duix?.setResponseCallback(object : DUIX.ResponseCallback {\n            override fun onResponseReceived(response: String) {\n                runOnUiThread {\n                    \/\/ Hiển thị phản hồi trong khung chat\n                    addChatMessage(response, false)\n                }\n            }\n        })/' "$CALL_ACTIVITY"
        
        echo "✅ Đã sửa xong CallActivity.kt"

    - name: "🔧 Fix MainActivity.kt"
      run: |
        MAIN_ACTIVITY="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt"
        
        echo "🔍 Đang sửa MainActivity.kt..."
        
        # Sửa các lỗi tương tự
        awk '{
          # Sửa lỗi backgroundColor -> setBackgroundColor
          gsub(/\.backgroundColor = /, ".setBackgroundColor(")
          
          # Sửa định nghĩa setupChatUI
          gsub(/private fun setupChatUI/, "protected override fun setupChatUI")
          
          # Sửa định nghĩa addChatMessage
          gsub(/private fun addChatMessage/, "protected override fun addChatMessage")
          
          print
        }' "$MAIN_ACTIVITY" > temp_file && mv temp_file "$MAIN_ACTIVITY"
        
        echo "✅ Đã sửa xong MainActivity.kt"
        
    - name: "🔧 Thêm ResponseCallback vào DUIX.java"
      run: |
        DUIX_JAVA="duix-android/dh_aigc_android/duix-sdk/src/main/java/ai/guiji/duix/sdk/client/DUIX.java"
        
        if [ -f "$DUIX_JAVA" ]; then
          echo "🔍 Đang tìm DUIX.java tại: $DUIX_JAVA"
          
          # Kiểm tra xem đã có ResponseCallback chưa
          if ! grep -q "interface ResponseCallback" "$DUIX_JAVA"; then
            echo "🔧 Thêm ResponseCallback interface..."
            
            # Thêm interface và biến
            awk '/public class DUIX/ {
              print
              print "    // Callback để trả về phản hồi từ AI"
              print "    public interface ResponseCallback {"
              print "        void onResponseReceived(String response);"
              print "    }"
              print ""
              print "    private ResponseCallback mResponseCallback;"
              print ""
              print "    public void setResponseCallback(ResponseCallback callback) {"
              print "        this.mResponseCallback = callback;"
              print "    }"
              next
            }
            /public void askAndSpeak/ {
              in_method = 1
              print
              next
            }
            in_method == 1 && /onSuccess/ {
              print
              print "            // Thông báo response về cho UI"
              print "            if (mResponseCallback != null) {"
              print "                mResponseCallback.onResponseReceived(content);"
              print "            }"
              next
            }
            in_method == 1 && /onError/ {
              in_error = 1
              print
              next
            }
            in_error == 1 && /Log\.e/ {
              print
              print "            if (mResponseCallback != null) {"
              print "                mResponseCallback.onResponseReceived(\"Xin lỗi, tôi gặp lỗi khi xử lý: \" + error);"
              print "            }"
              in_error = 0
              next
            }
            {print}' "$DUIX_JAVA" > temp_file && mv temp_file "$DUIX_JAVA"
            
            echo "✅ Đã thêm ResponseCallback vào DUIX.java"
          else
            echo "✓ DUIX.java đã có ResponseCallback"
          fi
        else
          echo "❌ Không tìm thấy DUIX.java tại đường dẫn mặc định"
          
          # Tìm file DUIX.java
          echo "🔍 Tìm file DUIX.java trong dự án..."
          FOUND_DUIX=$(find . -name "DUIX.java")
          
          if [ ! -z "$FOUND_DUIX" ]; then
            echo "✅ Đã tìm thấy DUIX.java tại: $FOUND_DUIX"
            # Thực hiện các sửa đổi tương tự ở trên
          else
            echo "❌ Không tìm thấy DUIX.java trong dự án"
          fi
        fi

    # ===== SETUP GRADLE & BUILD =====
    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    # ===== BUILD WITH DETAILED LOGGING =====
    - name: "🚀 Build APK (Lưu Log)"
      id: build
      run: |
        cd duix-android/dh_aigc_android
        # Build và lưu toàn bộ output
        ./gradlew assembleDebug --info > build_output.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        
        # Lưu exit code để biết build thành công hay thất bại
        echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV

    # ===== STEP MỚI: OUTPUT CHI TIẾT LỖI =====
    - name: "🔴 HIỂN THỊ LỖI CHI TIẾT"
      if: always()
      run: |
        cd duix-android/dh_aigc_android
        echo "========================================="
        echo "📊 KẾT QUẢ BUILD"
        echo "========================================="
        
        if [ "$BUILD_EXIT_CODE" == "0" ]; then
          echo "✅ BUILD THÀNH CÔNG!"
        else
          echo "❌ BUILD THẤT BẠI! (Exit code: $BUILD_EXIT_CODE)"
          
          echo ""
          echo "========================================="
          echo "🔴 TASK THẤT BẠI:"
          echo "========================================="
          grep "> Task.*FAILED" build_output.log || echo "Không tìm thấy task failed"
          
          echo ""
          echo "========================================="
          echo "🔴 LỖI KOTLIN:"
          echo "========================================="
          grep "e: " build_output.log | grep -v "note: " | head -20 || echo "Không tìm thấy lỗi Kotlin"
          
          echo ""
          echo "========================================="
          echo "🔴 LỖI KHÁC:"
          echo "========================================="
          grep -E "Error:|Exception:|FAILED" build_output.log | grep -v "at " | head -20 || echo "Không tìm thấy lỗi khác"
          
          echo ""
          echo "========================================="
          echo "🔴 NGUYÊN NHÂN LỖI:"
          echo "========================================="
          grep -A10 "What went wrong:" build_output.log || echo "Không tìm thấy phần What went wrong"
          
          echo ""
          echo "========================================="
          echo "🔴 NHỮNG DÒNG CUỐI CÙNG CỦA LOG:"
          echo "========================================="
          tail -n 30 build_output.log
        fi

    # ===== CHECK KOTLIN FILES =====
    - name: "📝 Kiểm Tra Các File Kotlin Đã Sửa"
      run: |
        echo "========================================="
        echo "📝 KIỂM TRA CALLACTIVITY.KT"
        echo "========================================="
        grep -n "private fun setupChatUI\|protected override fun setupChatUI\|private fun addChatMessage\|protected override fun addChatMessage\|backgroundColor\|setBackgroundColor" duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt || echo "Không tìm thấy mẫu cần kiểm tra"
        
        echo ""
        echo "========================================="
        echo "📝 KIỂM TRA MAINACTIVITY.KT"
        echo "========================================="
        grep -n "private fun setupChatUI\|protected override fun setupChatUI\|private fun addChatMessage\|protected override fun addChatMessage\|backgroundColor\|setBackgroundColor" duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt || echo "Không tìm thấy mẫu cần kiểm tra"

    # ===== UPLOAD CÁC FILE ĐÃ SỬA =====
    - name: "📤 Upload Modified Kotlin Files"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: modified-kotlin-files
        path: |
          duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt
          duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt
          duix-android/dh_aigc_android/duix-sdk/src/main/java/ai/guiji/duix/sdk/client/DUIX.java
        if-no-files-found: warn

    # ===== UPLOAD APK NẾU BUILD THÀNH CÔNG =====
    - name: "📦 Find APK Files"
      if: env.BUILD_FAILED != 'true'
      run: |
        echo "========================================="
        echo "📦 TÌM TẤT CẢ FILE APK:"
        echo "========================================="
        find duix-android -name "*.apk" -type f -exec ls -lh {} \; || echo "❌ Không tìm thấy file APK nào"

    - name: "📤 Upload APK"
      if: env.BUILD_FAILED != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: duix-mobile-apk
        path: duix-android/dh_aigc_android/**/build/outputs/apk/**/*.apk
        if-no-files-found: warn

    # ===== UPLOAD BUILD LOG =====
    - name: "📤 Upload Build Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: duix-android/dh_aigc_android/build_output.log
