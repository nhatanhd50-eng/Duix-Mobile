name: Build APK Final

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Cài CMake 3.18.1
    - name: Install CMake 3.18.1
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/

    # Bước 5: Cài NDK
    - name: Install NDK
      run: |
        sdkmanager --install "ndk;21.4.7075529"
        sdkmanager --install "ndk;25.2.9519653"

    # Bước 6: Setup Gradlew
    - name: Restore Gradlew Manually
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        chmod +x gradlew

    # Bước 7: Tạo local.properties
    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
        echo "cmake.dir=$ANDROID_HOME/cmake/3.18.1" >> local.properties

    # Bước 8: Build
    - name: Build with Gradle
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew assembleDebug --stacktrace

    # Bước 9: TÌM FILE APK (QUAN TRỌNG!)
    - name: Find APK files
      run: |
        echo "🔍 Tìm tất cả file APK..."
        find . -name "*.apk" -type f
        
        echo ""
        echo "📁 Chi tiết:"
        find . -name "*.apk" -type f -exec ls -lh {} \;

    # Bước 10: Upload APK (ĐÃ SỬA PATH)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-APK
        path: duix-android/dh_aigc_android/app/build/outputs/apk/debug/
        if-no-files-found: warn
