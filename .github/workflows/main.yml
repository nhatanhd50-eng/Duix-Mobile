name: Build APK Final Fix

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải source code (v2.0.1)
    - name: Download Source Code Archive
      run: wget https://github.com/duixcom/Duix-Mobile/archive/refs/tags/v2.0.1.tar.gz

    # Bước 2: Giải nén
    - name: Extract Source Code
      run: tar -xzf v2.0.1.tar.gz

    # Bước 3: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 4: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 5: Tìm file gradlew (Thay vì tìm build.gradle)
    # Lệnh này sẽ tìm file chạy build gốc
    - name: Find Gradlew location
      id: find_gradlew
      run: |
        # Tìm file gradlew ở bất cứ đâu
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        echo "gradlew_path=$GRADLEW_PATH" >> $GITHUB_OUTPUT
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Lỗi: Không tìm thấy file gradlew!"
          exit 1
        fi
        echo "Tìm thấy gradlew tại: $GRADLEW_PATH"

    # Bước 6: Cấp quyền và Build tại đúng chỗ gradlew đang nằm
    - name: Build with Gradle
      run: |
        GRADLEW="${{ steps.find_gradlew.outputs.gradlew_path }}"
        DIR=$(dirname "$GRADLEW")
        echo "Đang build trong thư mục: $DIR"
        cd $DIR
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    # Bước 7: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-Final-APK
        path: '**/*.apk'
