name: Build APK Find Error

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/

    - name: Install NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    # TÌM LỖI BẰNG CÁCH LỌC LOG
    - name: "🔍 BUILD VÀ TÌM LỖI"
      run: |
        cd duix-android/dh_aigc_android
        set +e
        
        echo "🚀 Bắt đầu build với filter lỗi..."
        ./gradlew assembleDebug --stacktrace 2>&1 | tee full_build.log
        
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        
        echo ""
        echo "========================================="
        echo "📊 KẾT QUẢ BUILD: Exit Code = $BUILD_EXIT_CODE"
        echo "========================================="
        
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo ""
          echo "========================================="
          echo "🔴 CÁC DÒNG CÓ 'FAILED':"
          echo "========================================="
          grep -i "FAILED" full_build.log || echo "Không tìm thấy"
          
          echo ""
          echo "========================================="
          echo "🔴 CÁC DÒNG CÓ 'ERROR':"
          echo "========================================="
          grep -i "ERROR" full_build.log | head -20 || echo "Không tìm thấy"
          
          echo ""
          echo "========================================="
          echo "🔴 CÁC DÒNG CÓ 'Exception':"
          echo "========================================="
          grep -i "Exception" full_build.log | head -20 || echo "Không tìm thấy"
          
          echo ""
          echo "========================================="
          echo "🔴 500 DÒNG TRƯỚC 'BUILD FAILED':"
          echo "========================================="
          # Tìm vị trí BUILD FAILED và lấy 500 dòng trước đó
          grep -B 500 "BUILD FAILED" full_build.log | tail -200 || tail -500 full_build.log
        fi
        
        exit $BUILD_EXIT_CODE

    # BUILD LẠI VỚI WARNING MODE
    - name: "🔍 CHẠY LẠI VỚI WARNING MODE"
      if: failure()
      run: |
        cd duix-android/dh_aigc_android
        echo "========================================="
        echo "📋 CHẠY VỚI --warning-mode all"
        echo "========================================="
        ./gradlew assembleDebug --warning-mode all 2>&1 | grep -A5 -B5 -i "deprecated\|warning\|error" | head -100 || true

    - name: Upload Full Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: duix-android/dh_aigc_android/full_build.log
        if-no-files-found: ignore
