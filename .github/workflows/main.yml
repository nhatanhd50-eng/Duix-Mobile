name: Build APK Debug Mode

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Cài CMake 3.18.1
    - name: Install CMake 3.18.1
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
        echo "✅ CMake 3.18.1 installed"

    # Bước 5: Cài NDK (CÓ THỂ ĐANG THIẾU!)
    - name: Install NDK
      run: |
        echo "📦 Cài đặt NDK..."
        sdkmanager --install "ndk;21.4.7075529"
        sdkmanager --install "ndk;23.1.7779620"
        sdkmanager --install "ndk;25.2.9519653"
        
        echo "✅ Các NDK đã cài:"
        ls -la $ANDROID_HOME/ndk/

    # Bước 6: Setup Gradlew
    - name: Restore Gradlew Manually
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        chmod +x gradlew

    # Bước 7: Kiểm tra cấu hình NDK trong project
    - name: Check NDK Config
      run: |
        cd duix-android/dh_aigc_android
        echo "📋 Kiểm tra build.gradle của duix-sdk:"
        cat duix-sdk/build.gradle | grep -i ndk || echo "Không tìm thấy cấu hình NDK"
        
        echo ""
        echo "📋 Kiểm tra local.properties:"
        cat local.properties 2>/dev/null || echo "Không có local.properties"

    # Bước 8: Tạo local.properties với NDK path
    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
        echo "cmake.dir=$ANDROID_HOME/cmake/3.18.1" >> local.properties
        
        echo "✅ local.properties:"
        cat local.properties

    # Bước 9: Build với INFO log
    - name: Build with Gradle (INFO mode)
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew --version
        
        # Build với --info để xem chi tiết lỗi
        ./gradlew assembleDebug --info --stacktrace 2>&1 | tee build.log
      env:
        GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

    # Bước 10: Upload log nếu fail
    - name: Upload Build Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: duix-android/dh_aigc_android/build.log

    # Bước 11: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-APK
        path: '**/*.apk'
