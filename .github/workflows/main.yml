name: Build APK Final CMake Fix

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Cài thủ công CMake 3.18.1
    - name: Install CMake 3.18.1
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
        echo "✅ CMake 3.18.1 installed"

    # Bước 5: Setup Gradlew với Gradle 8.3 (ỔN ĐỊNH)
    - name: Restore Gradlew Manually (Gradle 8.3)
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        chmod +x gradlew
        echo "✅ Gradle 8.3 ready"

    # Bước 6: Build
    - name: Build with Gradle
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew --version
        ./gradlew assembleDebug --stacktrace

    # Bước 7: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-Complete-APK
        path: '**/*.apk'
