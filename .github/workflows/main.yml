name: Build APK Auto Fix

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/

    - name: Install NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    # TỰ ĐỘNG SỬA LỖI
    - name: "🔧 AUTO FIX: Remove duplicate import"
      run: |
        FILE="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt"
        
        echo "📋 File cần sửa: $FILE"
        
        # Cách 1: Xóa dòng 29 (import thứ 2)
        sed -i '29d' "$FILE"
        
        # Hoặc Cách 2: Xóa dòng có "import android.widget.CompoundButton" thứ 2
        # awk '!/import android.widget.CompoundButton/ || !f++' "$FILE" > temp && mv temp "$FILE"
        
        echo "✅ Đã xóa import trùng lặp!"
        
        # Hiển thị dòng 20-35 để kiểm tra
        echo "📝 Kiểm tra import (dòng 20-35):"
        sed -n '20,35p' "$FILE"

    # BUILD
    - name: "🚀 Build APK"
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew assembleDebug --stacktrace

    - name: "📦 Upload APK"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: duix-android/dh_aigc_android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
