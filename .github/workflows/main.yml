name: Build APK From Release

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải source code v2.0.1
    - name: Download Source Code Archive
      run: wget https://github.com/duixcom/Duix-Mobile/archive/refs/tags/v2.0.1.tar.gz

    # Bước 2: Giải nén
    - name: Extract Source Code
      run: tar -xzf v2.0.1.tar.gz

    # Bước 3: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 4: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 5: Cấp quyền (Đã sửa đường dẫn chính xác: Duix-Mobile-2.0.1/duix-android/gradlew)
    - name: Grant execute permission for gradlew
      run: chmod +x Duix-Mobile-2.0.1/duix-android/gradlew

    # Bước 6: Build (Vào sâu vào thư mục duix-android rồi mới chạy)
    - name: Build with Gradle
      run: |
        cd Duix-Mobile-2.0.1/duix-android
        ./gradlew assembleDebug --stacktrace

    # Bước 7: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-Release-APK
        path: '**/*.apk'
