name: Build APK Final Manual Gradle

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Clone code
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    # Bước 2: Cài đặt Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Cài đặt thủ công Gradle 8.3 (Bắt buộc dùng bản này)
    - name: Manual Install Gradle 8.3
      run: |
        cd duix-android/dh_aigc_android
        
        # 1. Xóa sạch file gradlew và thư mục gradle cũ để reset lại
        echo "Dọn dẹp sạch sẽ..."
        rm -rf gradlew gradlew.bat gradle/
        
        # 2. Tải đúng file cài đặt Gradle 8.3
        echo "Đang tải bản Gradle 8.3 (BÁT BUỘC)..."
        wget https://services.gradle.org/distributions/gradle-8.3-bin.zip
        
        # 3. Giải nén
        echo "Đang giải nén..."
        unzip -q gradle-8.3-bin.zip
        
        # 4. Dùng BẢN VỪA TẢI về để tạo lại gradlew wrapper
        # Lệnh này sẽ tạo ra file gradlew gọi đến Gradle 8.3
        echo "Đang tạo gradlew từ file tải về..."
        ./gradle-8.3/bin/gradle wrapper --gradle-version 8.3
        
        # 5. Dọn dẹp thư mục cài đặt tạm
        rm -rf gradle-8.3 gradle-8.3-bin.zip
        
        # 6. Cấp quyền
        chmod +x gradlew
        echo "Đã xong!"

    # Bước 5: Build
    - name: Build with Gradle
      run: |
        cd duix-android/dh_aigc_android
        # Hiển thị version để kiểm tra
        ./gradlew --version
        ./gradlew assembleDebug --stacktrace

    # Bước 6: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-Manual-APK
        path: '**/*.apk'
