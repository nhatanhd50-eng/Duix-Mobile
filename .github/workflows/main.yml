name: Build APK Online

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải code
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt Java
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Bước 3: Cài đặt Android SDK (BƯỚC QUAN TRỌNG ĐỂ SỬA LỖI)
    # Thêm bước này để môi trường có đầy đủ sdkmanager và các công cụ cần thiết
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Bước 4: Cấp quyền thực thi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Bước 5: Build
    # Gradle sẽ tự động tải CMake và NDK cần thiết, bạn không cần chạy sdkmanager thủ công
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # Bước 6: Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-APK
        path: '**/*.apk'
