name: Build APK With Clear Error Logging

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake and NDK
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
        sdkmanager "ndk;25.2.9519653"

    # FIX CODE
    - name: "🔧 Fix Kotlin Files"
      run: |
        # 1. Fix CallActivity.kt
        CALL_ACTIVITY="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt"
        sed -i '29d' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/\.backgroundColor = /.setBackgroundColor(/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/etChat!!\.backgroundColor/etChat!!.setBackgroundColor/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun setupChatUI/protected override fun setupChatUI/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun addChatMessage/protected override fun addChatMessage/g' "$CALL_ACTIVITY" 2>/dev/null || true
        sed -i 's/var length = 0/var length: Int/g' "$CALL_ACTIVITY" 2>/dev/null || true

        # 2. Fix MainActivity.kt
        MAIN_ACTIVITY="duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt"
        sed -i 's/\.backgroundColor = /.setBackgroundColor(/g' "$MAIN_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun setupChatUI/protected override fun setupChatUI/g' "$MAIN_ACTIVITY" 2>/dev/null || true
        sed -i 's/private fun addChatMessage/protected override fun addChatMessage/g' "$MAIN_ACTIVITY" 2>/dev/null || true

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    # BUILD WITH LOG CAPTURE
    - name: "🚀 Build với Output Log"
      id: build
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew assembleDebug --info > build_output.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        
        # Lưu exit code
        echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
      continue-on-error: true

    # ===== STEP IN LOG LỖI (QUAN TRỌNG!) =====
    - name: "🔴 IN LOG LỖI CHI TIẾT"
      if: always()
      run: |
        cd duix-android/dh_aigc_android
        
        echo "========================================="
        echo "📊 KẾT QUẢ BUILD"
        echo "========================================="
        
        if [ "$BUILD_FAILED" != "true" ]; then
          echo "✅ BUILD THÀNH CÔNG!"
        else
          echo "❌ BUILD THẤT BẠI! (Exit code: $BUILD_EXIT_CODE)"
          
          echo ""
          echo "========================================="
          echo "🔴 TASK FAILED:"
          echo "========================================="
          grep "> Task.*FAILED" build_output.log || echo "Không tìm thấy task failed"
          
          echo ""
          echo "========================================="
          echo "🔴 ERROR MESSAGES:"
          echo "========================================="
          grep -A3 "What went wrong:" build_output.log || echo "Không tìm thấy mục What went wrong"
          
          echo ""
          echo "========================================="
          echo "🔴 KOTLIN ERRORS:"
          echo "========================================="
          grep -E "e: .*\.kt:" build_output.log | head -20 || echo "Không tìm thấy lỗi Kotlin"
          
          echo ""
          echo "========================================="
          echo "🔴 BUILD ERRORS:"
          echo "========================================="
          grep -E "Execution failed for task|error:" build_output.log | grep -v "at " | head -10 || echo "Không tìm thấy lỗi build cụ thể"
          
          echo ""
          echo "========================================="
          echo "🔴 EXCEPTION DETAILS:"
          echo "========================================="
          grep -A15 "Exception is:" build_output.log || echo "Không tìm thấy exception details"
          
          echo ""
          echo "========================================="
          echo "🔴 FULL ERROR STACKTRACE:"
          echo "========================================="
          grep -A30 "FAILURE:" build_output.log || echo "Không tìm thấy FAILURE section"
          
          echo ""
          echo "========================================="
          echo "🔴 100 DÒNG CUỐI CỦA LOG:"
          echo "========================================="
          tail -n 100 build_output.log
        fi

    # FIND APK FILES
    - name: "🔍 Tìm APK Sau Build"
      if: always()
      run: |
        echo "========================================="
        echo "🔍 TÌM TẤT CẢ FILE APK:"
        echo "========================================="
        find . -name "*.apk" -type f -exec ls -lh {} \; || echo "❌ Không tìm thấy APK"
        
        echo ""
        echo "========================================="
        echo "📁 KIỂM TRA THƯ MỤC BUILD/OUTPUTS:"
        echo "========================================="
        find duix-android -name "outputs" -type d | xargs ls -la 2>/dev/null || echo "❌ Không tìm thấy thư mục outputs"

    # BUILD SKIP LINTING
    - name: "🚀 Thử Build Bỏ Qua Linting"
      if: env.BUILD_FAILED == 'true'
      run: |
        cd duix-android/dh_aigc_android
        echo "========================================="
        echo "🔄 THỬ BUILD BỎ QUA LINTING"
        echo "========================================="
        ./gradlew assembleDebug -x lint -x lintVitalRelease --stacktrace

    # UPLOAD LOG FOR INVESTIGATION
    - name: "📤 Upload Build Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: duix-android/dh_aigc_android/build_output.log

    # UPLOAD MODIFIED FILES
    - name: "📤 Upload Modified Files"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: modified-kotlin-files
        path: |
          duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/CallActivity.kt
          duix-android/dh_aigc_android/test/src/main/java/ai/guiji/duix/test/ui/activity/MainActivity.kt
        if-no-files-found: warn

    # UPLOAD ANY APK FOUND
    - name: "📤 Upload All APKs"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-apks
        path: |
          **/*.apk
        if-no-files-found: warn
