name: Build APK with Gradle 9.0 & Logs (Fixed Path)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Di chuyển vào đúng thư mục chứa project Android
    - name: Change working directory
      run: |
        cd duix-android/dh_aigc_android
        pwd
        ls -la

    # Kiểm tra có phải project Gradle không (có settings.gradle không)
    - name: Check if Gradle project exists
      id: gradle_check
      run: |
        cd duix-android/dh_aigc_android
        if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
          echo "gradle_project_exists=true" >> $GITHUB_OUTPUT
        else
          echo "gradle_project_exists=false" >> $GITHUB_OUTPUT
        fi

    # Nếu thiếu gradlew/gradlew.bat, copy từ template hoặc tạo mới
    - name: Create gradlew if missing
      run: |
        cd duix-android/dh_aigc_android
        if [ ! -f "gradlew" ]; then
          echo "#!/bin/sh" > gradlew
          echo "exec ./gradlew.bat \"\$@\"" >> gradlew
          chmod +x gradlew
          echo "@echo off" > gradlew.bat
          echo "set DIRNAME=%~dp0" >> gradlew.bat
          echo "if \"%OS%\" == \"Windows_NT\" setlocal" >> gradlew.bat
          echo "set APP_BASE_NAME=%~n0" >> gradlew.bat
          echo "set APP_HOME=%DIRNAME%" >> gradlew.bat
          echo "java -jar \"%APP_HOME%gradle/wrapper/gradle-wrapper.jar\" %*" >> gradlew.bat
          echo "exit /b %ERRORLEVEL%" >> gradlew.bat
        fi

    # Cập nhật Gradle Wrapper lên 9.0 (nếu cần)
    - name: Update Gradle Wrapper to 9.0
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew wrapper --gradle-version 9.0 --distribution-type bin

    - name: Check gradlew exists
      run: |
        cd duix-android/dh_aigc_android
        ls -la gradlew gradlew.bat
        ./gradlew --version

    # Build APK với log full
    - name: Build Debug APK
      id: build_debug
      run: |
        cd duix-android/dh_aigc_android
        ./gradlew assembleDebug --no-daemon --stacktrace --info > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
      continue-on-error: true

    # In toàn bộ log lỗi (nếu có) ra terminal để bạn dễ copy
    - name: 🔍 Print Full Build Log (Copy All Below)
      if: env.BUILD_FAILED == 'true'
      run: |
        cd duix-android/dh_aigc_android
        echo "📋 FULL BUILD LOG (COPY ALL BELOW):"
        echo "====================================="
        cat build_log.txt
        echo "====================================="
        echo "📋 END OF LOG"
      shell: bash

    # Upload log lỗi nếu build fail
    - name: 📤 Upload Build Log (on failure)
      if: env.BUILD_FAILED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: duix-android/dh_aigc_android/build_log.txt

    # Upload APK nếu build success
    - name: 📦 Upload Debug APK
      if: env.BUILD_FAILED != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: duix-android/dh_aigc_android/app/build/outputs/apk/debug/app-debug.apk

    # Upload toàn bộ log dù có lỗi hay không
    - name: 📤 Upload Full Build Log (Always)
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: duix-android/dh_aigc_android/build_log.txt
