name: Build APK Duix Mobile (Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Vào thư mục dự án
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: nhatanhd50-eng/Duix-Mobile
          ref: main

      # Bước 2: Cài đặt Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Cài đặt Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Bước 4: Setup Gradlew (QUAN TRỌNG)
      - name: Setup Gradlew
        run: |
          cd duix-android/dh_aigc_android
          
          # LƯU Ý CHỈ CÁC TÍCH NHẮN BƯỚC
          chmod +x gradlew assembleDebug --stacktrace

    # Bước 5: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duix-Mobile-Final-APK
          path: '**/*.apk'
