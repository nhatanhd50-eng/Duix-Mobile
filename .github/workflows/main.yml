name: Build with JDK 17 & Kotlin Fix (High Memory)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. BẮT BUỘC DÙNG JDK 17 (Theo yêu cầu của Android Gradle Plugin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. CÀI ĐẶT CMAKE 3.18.1
      - name: Install CMake 3.18.1
        run: |
          echo "Installing CMake 3.18.1..."
          echo "yes" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.18.1"

      # 3. CÀI ĐẶT GRADLE 8.5
      - name: Setup Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      # 4. BUILD VỚI CẤU HÌNH FIX LỖI KOTLIN CRASH
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building with JDK 17 + Memory Tuning..."
          
          # CÁC THAM SỐ QUAN TRỌNG ĐỂ SỬA LỖI:
          # -Xmx6g: Cấp 6GB RAM cho Gradle (Github Runner có 7GB)
          # kotlin.compiler.execution.strategy=in-process: Ép Kotlin chạy trực tiếp, tránh lỗi Worker chết
          # kotlin.daemon.jvm.options: Cấp RAM riêng cho daemon Kotlin
          
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 5. HIỂN THỊ LỖI (Vẫn giữ 200 dòng cuối)
      - name: 🔴 SHOW REAL ERROR (Last 200 lines)
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "👇 ĐÂY MỚI LÀ LỖI (LAST 200 LINES) - COPY ĐOẠN NÀY 👇"
          echo "========================================================="
          tail -n 200 build_log.txt
          echo "========================================================="
          exit 1

      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
