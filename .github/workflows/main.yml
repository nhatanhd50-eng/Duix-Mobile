name: Build APK (Final Clean Build)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Tải code về
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cài Java 17 (Bắt buộc)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cài CMake 3.18.1 (VẪN CẦN BƯỚC NÀY VÌ GITHUB KHÔNG CÓ SẴN)
      - name: Install CMake 3.18.1
        run: |
          echo "Downloading CMake 3.18.1..."
          wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
          mkdir -p $ANDROID_HOME/cmake/3.18.1
          cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/
          echo "✅ CMake 3.18.1 installed."

      # 5. Ép dùng Gradle 8.3 (VẪN CẦN ĐỂ KHỚP VỚI CODE CỦA BẠN)
      - name: Restore Gradlew (Gradle 8.3)
        run: |
          cd duix-android/dh_aigc_android
          rm -rf gradlew gradlew.bat gradle/
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew

      # 6. CHẠY BUILD (Với cấu hình tối ưu RAM)
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building..."
          ./gradlew assembleDebug \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process \
            > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 7. HIỂN THỊ LỖI (Nếu có)
      - name: 🔴 SHOW ERRORS
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          if grep -q "e: " build_log.txt; then
            grep -C 3 "e: " build_log.txt
          else
             grep -C 10 -E "(FAILURE:|FAILED|What went wrong:|Exception)" build_log.txt
          fi
          echo "========================================================="
          exit 1

      # 8. Upload APK
      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Duix-Mobile-APK
          path: '**/*.apk'
