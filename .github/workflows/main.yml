name: Build APK Online

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # --- SỬA ĐÚNG ĐƯỜNG DẪN: duix-android/dh_aigc_android ---
    
    - name: Grant execute permission for gradlew
      working-directory: ./duix-android/dh_aigc_android
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./duix-android/dh_aigc_android
      run: ./gradlew assembleDebug --stacktrace

    # ------------------------------------------------------------------

    - name: Find APK location
      id: find_apk
      run: |
        # Tìm file .apk trong thư mục sâu đó
        find ./duix-android/dh_aigc_android -type f -name "*.apk" -size +1000k > apk_path.txt
        
        echo "Tìm thấy các file APK:"
        cat apk_path.txt
        
        echo "path=$(head -n 1 apk_path.txt)" >> $GITHUB_OUTPUT

    - name: Upload found APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-APK
        path: ${{ steps.find_apk.outputs.path }}
