name: Build & Show Errors Directly

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. CÀI ĐẶT GRADLE (Bản 8.5 cho an toàn)
      - name: Setup Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      # 2. CHẠY BUILD & GHI LOG RA FILE (Không in rác ra màn hình)
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building... (Please wait)"
          
          # Lưu toàn bộ log vào file để lọc sau
          gradle assembleDebug --no-daemon --stacktrace --info > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 3. LỌC VÀ HIỂN THỊ LỖI NGAY LẬP TỨC (Đây là bước bạn cần)
      - name: 🔴 SHOW BUILD ERRORS
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "🔥 PHÁT HIỆN LỖI (ERRORS DETECTED) - COPY ĐOẠN DƯỚI ĐÂY 🔥"
          echo "========================================================="
          
          # Dùng grep để tìm các từ khóa lỗi và in ra 10 dòng xung quanh nó
          # -n: hiện số dòng
          # -C 10: hiện 10 dòng context trước và sau lỗi để dễ hiểu ngữ cảnh
          # -E: tìm nhiều từ khóa cùng lúc
          grep -n -C 10 -E "(FAILURE:|FAILED|Exception|error|What went wrong:|Caused by:)" build_log.txt
          
          echo "========================================================="
          echo "❌ Quy trình sẽ dừng tại đây. Hãy sửa lỗi trên."
          exit 1

      # 4. UPLOAD APK (Chỉ chạy nếu KHÔNG có lỗi)
      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
