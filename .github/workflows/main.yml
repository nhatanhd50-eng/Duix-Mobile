name: Build Java 17 & Find Kotlin Error

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SETUP JAVA 17 (BẮT BUỘC)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. INSTALL CMAKE 3.18.1 (ĐỂ TRÁNH LỖI CXX1300)
      - name: Install CMake 3.18.1
        run: |
          echo "yes" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.18.1"

      # 3. SETUP GRADLE 8.5
      - name: Setup Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      # 4. BUILD VỚI CẤU HÌNH RAM KHỦNG & IN-PROCESS
      - name: Build Debug APK
        id: build_step
        run: |
          cd duix-android/dh_aigc_android
          echo "🚀 Building..."
          
          # -Dkotlin.compiler.execution.strategy=in-process: Ép chạy chung tiến trình để không bị crash worker
          # -Xmx6g: Cấp 6GB RAM
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process \
            > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      # 5. LỌC LỖI THÔNG MINH (QUAN TRỌNG NHẤT)
      - name: 🔴 SHOW KOTLIN ERRORS
        if: env.BUILD_FAILED == 'true'
        run: |
          cd duix-android/dh_aigc_android
          echo "========================================================="
          echo "🔥 TÌM THẤY CÁC LỖI SAU TRONG CODE (KOTLIN ERRORS) 🔥"
          echo "========================================================="
          
          # Tìm các dòng bắt đầu bằng 'e: ' (Lỗi Kotlin) hoặc 'ERROR'
          # In thêm 2 dòng trước/sau để hiểu ngữ cảnh
          grep -C 5 -E "^e: |ERROR:|FAILURE:|What went wrong:" build_log.txt || echo "Không tìm thấy lỗi cú pháp cụ thể, hãy xem 200 dòng cuối bên dưới."
          
          echo "========================================================="
          echo "👇 100 DÒNG CUỐI (STACK TRACE) 👇"
          tail -n 100 build_log.txt
          echo "========================================================="
          exit 1

      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
