name: Build APK With Error Log

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: nhatanhd50-eng/Duix-Mobile
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install CMake
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
        tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
        mkdir -p $ANDROID_HOME/cmake/3.18.1
        cp -r cmake-3.18.1-Linux-x86_64/* $ANDROID_HOME/cmake/3.18.1/

    - name: Install NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Setup Gradlew
      run: |
        cd duix-android/dh_aigc_android
        rm -rf gradlew gradlew.bat gradle/
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        chmod +x gradlew

    - name: Create local.properties
      run: |
        cd duix-android/dh_aigc_android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/25.2.9519653
        cmake.dir=$ANDROID_HOME/cmake/3.18.1
        EOF

    # BUILD - LƯU LOG VÀO FILE
    - name: "🚀 Build APK"
      id: build_apk
      run: |
        cd duix-android/dh_aigc_android
        
        # Build và lưu TOÀN BỘ log vào file
        ./gradlew assembleDebug --stacktrace --debug > build_full.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
        
        # Lưu exit code
        echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
      continue-on-error: true

    # IN LOG LỖI - STEP RIÊNG
    - name: "🔴 IN LOG LỖI"
      if: always()
      run: |
        cd duix-android/dh_aigc_android
        
        echo "========================================="
        echo "📊 PHÂN TÍCH KẾT QUẢ BUILD"
        echo "========================================="
        
        if [ -f build_full.log ]; then
          # Kiểm tra build status
          if grep -q "BUILD SUCCESSFUL" build_full.log; then
            echo "✅ BUILD THÀNH CÔNG!"
            echo ""
            echo "📦 Tìm APK..."
            find . -name "*.apk" -type f -exec ls -lh {} \;
          else
            echo "❌ BUILD THẤT BẠI!"
            echo ""
            echo "========================================="
            echo "🔍 TÌM TASK FAILED:"
            echo "========================================="
            grep "> Task.*FAILED" build_full.log || echo "Không tìm thấy task failed"
            
            echo ""
            echo "========================================="
            echo "🔍 TÌM ERROR:"
            echo "========================================="
            grep -i "error:" build_full.log | head -20 || echo "Không tìm thấy error"
            
            echo ""
            echo "========================================="
            echo "🔍 TÌM EXCEPTION:"
            echo "========================================="
            grep -A5 "Exception" build_full.log | head -50 || echo "Không tìm thấy exception"
            
            echo ""
            echo "========================================="
            echo "🔍 TÌM NGUYÊN NHÂN (What went wrong):"
            echo "========================================="
            grep -A10 "What went wrong:" build_full.log || echo "Không tìm thấy"
            
            echo ""
            echo "========================================="
            echo "📜 200 DÒNG CUỐI CỦA LOG:"
            echo "========================================="
            tail -n 200 build_full.log
          fi
        else
          echo "❌ Không tìm thấy file log!"
        fi

    # STEP RIÊNG CHO TỪNG LOẠI LỖI
    - name: "📋 Tìm Lỗi Compilation"
      if: failure() 
      run: |
        cd duix-android/dh_aigc_android
        if [ -f build_full.log ]; then
          echo "🔍 Lỗi Compilation:"
          grep -B5 -A5 "compilation failed\|cannot find symbol\|unresolved reference" build_full.log | head -100 || echo "Không có lỗi compilation"
        fi

    - name: "📋 Tìm Lỗi Resources"  
      if: failure()
      run: |
        cd duix-android/dh_aigc_android
        if [ -f build_full.log ]; then
          echo "🔍 Lỗi Resources:"
          grep -B5 -A5 "AAPT\|resource.*not found\|No resource found" build_full.log | head -100 || echo "Không có lỗi resources"
        fi

    - name: "📋 Tìm Lỗi CMake/NDK"
      if: failure()
      run: |
        cd duix-android/dh_aigc_android
        if [ -f build_full.log ]; then
          echo "🔍 Lỗi CMake/NDK:"
          grep -B5 -A5 "CMake\|NDK\|ninja\|C++\|undefined reference" build_full.log | head -100 || echo "Không có lỗi CMake/NDK"
        fi

    # UPLOAD LOG ĐẦY ĐỦ
    - name: "📤 Upload Full Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: complete-build-log
        path: duix-android/dh_aigc_android/build_full.log
        if-no-files-found: ignore

    # UPLOAD APK NẾU CÓ
    - name: "📤 Upload APK"
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: duix-android/dh_aigc_android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
