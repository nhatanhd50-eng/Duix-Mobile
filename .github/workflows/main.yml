name: Build APK Duix Mobile (Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 17 (BẮT BUỘC)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Cài đặt Android SDK (Quan trọng)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # `android-actions/setup-android` sẽ tự động cài NDK và CMake phù hợp nhất, tránh lỗi thủ công.

      # Bước 4: Cấp quyền thực thi cho Gradle
      - name: Grant execute permission for Gradlew
        run: |
          chmod +x gradlew
        # Chỉ cần cấp quyền thực thi (execute) để chạy được.
        # Không cần cài CMake thủ công.

      # Bước 5: Build (Chạy lệnh chuẩn)
      - name: Build APK
        run: |
          cd duix-android/dh_aigc_android
          ./gradlew assembleDebug --stacktrace
